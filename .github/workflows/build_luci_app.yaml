name: Build LuCI App

on:
  push:
    tags:
      - 'luci-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build IPK Package
    runs-on: ubuntu-24.04
    env:
      # PKGARCH:=all in the package Makefile, so any target SDK can build it.
      SDK_URL: https://downloads.openwrt.org/releases/24.10.1/targets/x86/64/openwrt-sdk-24.10.1-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_DIR: openwrt-sdk-24.10.1-x86-64_gcc-13.3.0_musl.Linux-x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download and extract OpenWrt SDK
        run: |
          wget -q "$SDK_URL"
          tar --use-compress-program=unzstd -xf "$(basename "$SDK_URL")"
          mv "$SDK_DIR" openwrt-sdk

      - name: Update feeds and stage package
        run: |
          cd openwrt-sdk
          ./scripts/feeds update luci
          mkdir -p package/luci-app-mullvad-wireguard
          cp -r ../luci-app-mullvad-wireguard/. package/luci-app-mullvad-wireguard/
          sed -i 's|include ../../luci.mk|include $(TOPDIR)/feeds/luci/luci.mk|' package/luci-app-mullvad-wireguard/Makefile

      - name: Configure and build
        run: |
          cd openwrt-sdk
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-mullvad-wireguard=y" >> .config
          make defconfig
          make -j1 V=s package/luci-app-mullvad-wireguard/compile

      - name: Find and copy IPK file
        id: find_ipk
        run: |
          cd openwrt-sdk
          IPK_FILE=$(find bin/packages -name "luci-app-mullvad-wireguard*.ipk" -type f)
          if [ -z "$IPK_FILE" ]; then
            echo "Error: IPK file not found"
            exit 1
          fi
          cp "$IPK_FILE" ../
          echo "ipk_file=$(basename "$IPK_FILE")" >> "$GITHUB_OUTPUT"

      - name: Upload IPK as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luci-app-mullvad-wireguard-ipk
          path: ${{ steps.find_ipk.outputs.ipk_file }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: luci-app-mullvad-wireguard-ipk
          path: release-files

      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: release-files/*.ipk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
