name: Deploy Feed

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-feed
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish opkg feed
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build ipk
        id: build
        uses: ./.github/actions/build-ipk

      - name: Assemble feed
        run: |
          mkdir -p feed
          cp "${{ steps.build.outputs.ipk-path }}" feed/
          # ipkg-make-index.sh shells out to $MKHASH for SHA256sum entries.
          export MKHASH="$(pwd)/${{ steps.build.outputs.sdk-dir }}/staging_dir/host/bin/mkhash"
          cd feed
          "../${{ steps.build.outputs.sdk-dir }}/scripts/ipkg-make-index.sh" . > Packages
          gzip -9c Packages > Packages.gz
          touch .nojekyll

      # keep_files preserves the pr-preview/ subtree deployed by pr_feed.yaml,
      # which runs as a separate workflow against the same gh-pages branch.
      - name: Deploy feed to GitHub Pages
        uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./feed
          keep_files: true
          commit_message: "deploy: feed for ${{ github.sha }}"
